# OpenAI 형식 외부 API(기본 Groq 무료 키)로 LlmServer openai 모드 판정 시간을 잰다.
# 16번 줄은 진짜 취약점(TRUE_POSITIVE), 22번과 26번 줄은 안전한 코드다. 결과는 Summary 탭에 표로 나온다.
name: api-bench

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'API 주소 (/chat/completions 앞까지)'
        default: https://api.groq.com/openai/v1
      model:
        description: 모델 이름
        default: openai/gpt-oss-120b
      runs:
        description: 줄마다 반복 횟수
        default: '3'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SR_LLM_PROVIDER: openai
      SR_LLM_BASE_URL: ${{ inputs.base_url }}
      SR_LLM_MODEL: ${{ inputs.model }}
      SR_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      SR_INTERNAL_KEY: bench-only
      RUNS: ${{ inputs.runs }}
      MAVEN_OPTS: -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8
    defaults:
      run:
        working-directory: llm-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 컴파일
        run: ./mvnw -q -B -DskipTests compile

      - name: API 직접 호출 확인
        run: |
          echo "사용 가능한 모델:"
          curl -s -m 30 "$SR_LLM_BASE_URL/models" -H "Authorization: Bearer $SR_LLM_API_KEY" | jq -r '.data[].id' | sort
          curl -s -m 60 -i "$SR_LLM_BASE_URL/chat/completions" \
            -H "Authorization: Bearer $SR_LLM_API_KEY" -H "Content-Type: application/json" \
            -d "{\"model\":\"$SR_LLM_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with JSON {\\\"ok\\\":true}\"}],\"response_format\":{\"type\":\"json_object\"}}" \
            | head -c 1500

      - name: LLM 서버 실행 (openai 모드)
        run: |
          nohup ./mvnw -q -B exec:java "-Dexec.mainClass=secureview.llm.LlmServer" > /tmp/server.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf -H "X-Internal-Key: $SR_INTERNAL_KEY" http://127.0.0.1:8081/internal/health && exit 0
            sleep 1
          done
          cat /tmp/server.log
          exit 1

      - name: 판정 측정
        run: |
          {
            echo "## API 판정 ($SR_LLM_BASE_URL, 모델 $SR_LLM_MODEL, 줄마다 ${RUNS}회)"
            echo "| 줄 | 회차 | 시간 | 결과 | 기대 |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for line in 16 22 26; do
            [ "$line" = 16 ] && expect=TRUE_POSITIVE || expect=LIKELY_FALSE_POSITIVE
            jq ".finding.line = $line" examples/judge-request.json > /tmp/req.json
            for i in $(seq 1 "$RUNS"); do
              start=$(date +%s%N)
              curl -s -H "X-Internal-Key: $SR_INTERNAL_KEY" -H "Content-Type: application/json" \
                --data-binary @/tmp/req.json http://127.0.0.1:8081/internal/judge > /tmp/res.json
              ms=$(( ($(date +%s%N) - start) / 1000000 ))
              verdict=$(jq -r '.llm.verdict // .error' /tmp/res.json)
              echo "줄 $line, $i회: $ms ms, $verdict"
              echo "| $line | $i | $(( ms / 1000 )).$(( ms % 1000 / 100 ))초 | $verdict | $expect |" >> "$GITHUB_STEP_SUMMARY"
              sleep 10  # 무료 한도(분당 토큰) 때문에 간격을 둔다
            done
          done
          echo "마지막 응답:"; jq . /tmp/res.json

      - name: 서버 로그
        if: always()
        run: tail -50 /tmp/server.log
