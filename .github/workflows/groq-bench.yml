# 무료 외부 API(Groq) 한도 안에서 판정 정확도를 많이 잰다. 하루 토큰 한도 때문에 한 번에 다 못 재므로
# 6시간마다 이어서 재고, 결과(bench/results/*.jsonl)를 이 저장소에 커밋한다. 이미 잰 테스트는 건너뛴다.
# owasp: OWASP Benchmark SQL·명령어·경로·XSS에서 진짜·안전을 같은 수로 골라 PR 검토와 같은 순서로 판정
# large: 500줄 파일 하나를 PR 헝크 검토(예산 45초)로 반복 검토 (한도에 걸려도 기다리지 않음, 실제 PR과 같게)
name: groq-bench

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "owasp 또는 large"
        default: owasp
      per_category:
        description: "owasp: 분류마다 고를 테스트 수 (진짜·안전 반씩)"
        default: '126'
      minutes:
        description: "owasp: 이번 실행에서 잴 최대 시간(분)"
        default: '300'
      runs:
        description: "large: 반복 횟수"
        default: '3'
      model:
        description: "Groq 모델 이름"
        default: openai/gpt-oss-120b

permissions:
  contents: write

concurrency:
  group: groq-bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODE: ${{ inputs.mode || 'owasp' }}
      PER_CATEGORY: ${{ inputs.per_category || '126' }}
      MINUTES: ${{ inputs.minutes || '300' }}
      RUNS: ${{ inputs.runs || '3' }}
      SR_LLM_BASE_URL: https://api.groq.com/openai/v1
      SR_LLM_MODEL: ${{ inputs.model || 'openai/gpt-oss-120b' }}
      SR_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      BENCHMARK_COMMIT: a452b3aafd232245d0753e54eb243d6651f8ef96
      MAVEN_OPTS: -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: OWASP Benchmark 테스트 코드 (경고 CSV를 만든 것과 같은 커밋)
        if: env.MODE == 'owasp'
        run: |
          git init -q /tmp/bj
          cd /tmp/bj
          git remote add origin https://github.com/OWASP-Benchmark/BenchmarkJava.git
          git sparse-checkout set src/main/java/org/owasp/benchmark/testcode
          git fetch -q --depth 1 --filter=blob:none origin "$BENCHMARK_COMMIT"
          git checkout -q FETCH_HEAD
          ls src/main/java/org/owasp/benchmark/testcode | wc -l

      - name: 측정
        working-directory: llm-server
        timeout-minutes: 340
        run: |
          slug="${SR_LLM_MODEL//\//-}"
          echo "SLUG=$slug" >> "$GITHUB_ENV"
          if [ "$MODE" = owasp ]; then
            args="owasp /tmp/bj $GITHUB_WORKSPACE/bench/owasp $GITHUB_WORKSPACE/bench/results/owasp-$slug.jsonl $PER_CATEGORY $MINUTES"
          else
            args="large examples/Large500.java $RUNS"
          fi
          ./mvnw -q -B test-compile exec:java -Dexec.classpathScope=test -Dexec.mainClass=secureview.llm.ApiBench "-Dexec.args=$args" \
            | tee /tmp/bench.log

      - name: 결과 요약
        if: always()
        run: |
          if [ "$MODE" = owasp ] && [ -f "bench/results/owasp-$SLUG.md" ]; then
            cat "bench/results/owasp-$SLUG.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f /tmp/bench.log ]; then
            { echo '```'; cat /tmp/bench.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            if [ "$MODE" = large ]; then
              { echo "## $(date -u +%F) $SR_LLM_MODEL"; echo '```'; cat /tmp/bench.log; echo '```'; } >> "bench/results/large500-$SLUG.md"
            fi
          fi

      - name: 결과 커밋 (다음 실행이 이어서 잰다)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/results
          git diff --cached --quiet && exit 0
          git commit -q -m "측정 결과: $MODE $SR_LLM_MODEL [skip ci]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
