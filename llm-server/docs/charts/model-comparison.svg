<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img" aria-label="모델 비교: 정답 수와 판정 시간">
<title>모델 비교: 정답 수와 판정 시간</title>
<style>
