<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 382" width="680" height="382" role="img" aria-label="CWE별 오탐 감소 (v1.1.2)">
<title>CWE별 오탐 감소 (v1.1.2)</title>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926}}
text{font-family:system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;font-size:12px;fill:var(--ink2)}
.t{font-size:15px;font-weight:600;fill:var(--ink)}.n{fill:var(--muted)}.v{fill:var(--ink);font-weight:600}.tick{font-variant-numeric:tabular-nums;fill:var(--muted)}
</style>
<rect width="680" height="382" fill="var(--surface)"/>
<text class="t" x="20" y="28">CWE별 오탐 감소 (v1.1.2)</text>
<text class="n" x="20" y="47">안전한 코드 중 오탐으로 걸러 낸 비율. CWE당 2~5건이라 참고용</text>
<text x="180" y="79" text-anchor="end">CWE-22 경로 조작</text><path d="M190,66H586Q590,66 590,70V78Q590,82 586,82H190Z" fill="var(--s1)"><title>CWE-22 경로 조작: 2/2건</title></path><text x="598" y="79" text-anchor="start" class="v">2/2건</text><text x="180" y="109" text-anchor="end">CWE-79 XSS</text><path d="M190,96H586Q590,96 590,100V108Q590,112 586,112H190Z" fill="var(--s1)"><title>CWE-79 XSS: 2/2건</title></path><text x="598" y="109" text-anchor="start" class="v">2/2건</text><text x="180" y="139" text-anchor="end">CWE-89 SQL 인젝션</text><path d="M190,126H506Q510,126 510,130V138Q510,142 506,142H190Z" fill="var(--s1)"><title>CWE-89 SQL 인젝션: 4/5건</title></path><text x="518" y="139" text-anchor="start" class="v">4/5건</text><text x="180" y="169" text-anchor="end">CWE-78 명령어 삽입</text><path d="M190,156H586Q590,156 590,160V168Q590,172 586,172H190Z" fill="var(--s1)"><title>CWE-78 명령어 삽입: 2/2건</title></path><text x="598" y="169" text-anchor="start" class="v">2/2건</text><text x="180" y="199" text-anchor="end">CWE-120 버퍼 오버플로</text><text x="198" y="199" text-anchor="start" class="v">0/2건</text><text x="180" y="229" text-anchor="end">CWE-134 포맷 스트링</text><path d="M190,216H386Q390,216 390,220V228Q390,232 386,232H190Z" fill="var(--s1)"><title>CWE-134 포맷 스트링: 1/2건</title></path><text x="398" y="229" text-anchor="start" class="v">1/2건</text><text x="180" y="259" text-anchor="end">CWE-190 정수 오버플로</text><path d="M190,246H386Q390,246 390,250V258Q390,262 386,262H190Z" fill="var(--s1)"><title>CWE-190 정수 오버플로: 1/2건</title></path><text x="398" y="259" text-anchor="start" class="v">1/2건</text><text x="180" y="289" text-anchor="end">CWE-416 해제 후 사용</text><text x="198" y="289" text-anchor="start" class="v">0/2건</text><text x="180" y="319" text-anchor="end">CWE-476 널 역참조</text><text x="198" y="319" text-anchor="start" class="v">0/2건</text><text x="180" y="349" text-anchor="end">CWE-798 하드코딩 비밀</text><text x="198" y="349" text-anchor="start" class="v">0/2건</text><line x1="190" x2="190" y1="60" y2="364" stroke="var(--axis)"/>
</svg>
